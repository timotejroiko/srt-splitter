name: Prebuild

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prebuild.yml"

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  prebuild:
    name: ${{ matrix.artifact }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/prebuild/almalinux-devtoolset11@sha256:571725f82382b5d5ed3028bf0309db2d25fda58e27807f3fe777f1a3bf426cce
            artifact: linux-x64
          - os: ubuntu-latest
            container: ghcr.io/prebuild/linux-arm64@sha256:b13f3f7bae77424a5f01651adbbbd9e4e643aeea842eceddfe6c3cca402b3a2c
            artifact: linux-arm64
          - os: macos-latest
            artifact: darwin-arm64
          - os: windows-2022
            artifact: win32-x64
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install AlmaLinux build prerequisites
        if: matrix.artifact == 'linux-x64'
        run: |
          microdnf install -y tcl openssl-devel cmake pkgconf-pkg-config
          microdnf clean all
      - name: Install Debian ARM64 build prerequisites
        if: matrix.artifact == 'linux-arm64'
        run: |
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y tcl libssl-dev:arm64 cmake pkg-config
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "CFLAGS=-I/usr/include" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I/usr/include" >> "$GITHUB_ENV"
      - name: Check Linux container runtime
        if: runner.os == 'Linux'
        run: |
          node --version
          npm --version
          python --version || python3 --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) throw new Error('Linux container needs Node 24 or newer')"
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run prebuild
      - run: |
          node -e "const { createSrt } = require('./src/srt'); const { srt } = createSrt(); const fd = srt.createSocket(false); if (fd < 0) throw new Error('createSocket failed: ' + fd); srt.close(fd); console.log('native prebuild OK')"
      - name: Commit prebuild
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "prebuilds/${{ matrix.artifact }}/"
          git diff --staged --quiet || git commit -m "chore: update prebuilds (${{ matrix.artifact }})"
          git push origin HEAD:main
