name: Prebuild

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prebuild.yml"

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  prebuild:
    name: ${{ matrix.artifact }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/prebuild/almalinux-devtoolset11
            artifact: linux-x64
          - os: ubuntu-latest
            container: ghcr.io/prebuild/linux-arm64
            artifact: linux-arm64
          - os: macos-latest
            artifact: darwin-arm64
          - os: windows-2022
            artifact: win32-x64
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y tar tcl
          elif command -v yum >/dev/null 2>&1; then
            yum install -y tar tcl
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y tar tcl
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar tcl
          else
            echo "No supported Linux package manager found"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run prebuild
      - run: |
          node -e "const { createSrt } = require('./src/srt'); const { srt } = createSrt(); const fd = srt.createSocket(false); if (fd < 0) throw new Error('createSocket failed: ' + fd); srt.close(fd); console.log('native prebuild OK')"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "prebuilds/${{ matrix.artifact }}/"
          git diff --staged --quiet || git commit -m "chore: update prebuilds (${{ matrix.artifact }})"
          git push origin HEAD:main
